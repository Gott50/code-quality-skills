name: secret-scan

# Scans the commits a PR adds — and every push to main — for credentials, so a
# commit made with `--no-verify` is still caught. The pre-commit hook scans the
# staged diff; this job scans the history the hook never saw. Markdown is not
# skipped: a credential in a README is a credential.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `fetch-depth: 0` is required: the Action diffs the PR's commits, and a
      # shallow clone has no base to diff against.
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The Action installs the gitleaks build named by GITLEAKS_VERSION, so the
      # CI scan runs the same version the hook's pinned binary does and the two
      # halves cannot disagree about a finding. GITLEAKS_LICENSE is required for
      # an organization account and ignored for a personal one; without it the
      # job fails with the Action's own message, which is the correct outcome —
      # a gate that cannot run must not report green.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_VERSION: 8.30.1
