name: ci

# Runs the fast gates on every PR and on push to main, the mutation gate on PRs
# only (it is the slowest), and the fallow health report as a non-blocking
# signal. Markdown-only changes skip the run.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # One step for both managers: the lockfile names the manager, the same
      # evidence the detector uses. corepack makes pnpm available.
      - name: Install dependencies
        run: sh -c 'if test -f pnpm-lock.yaml; then corepack enable && pnpm install --frozen-lockfile; else npm ci; fi'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      # `npm run test` carries the per-file coverage gate, floored by the
      # committed baseline (100% when there is none).
      - name: Test with the coverage gate
        run: npm run test

  # Mutation gate — enforces the per-file mutation floors from the committed
  # baseline (0 Timeout / 0 Survived / 0 NoCoverage when there is none) on
  # the PR's changed source files. Mirrors the pre-push hook so the strongest
  # quality gate is enforced on PRs, not just local pushes.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: sh -c 'if test -f pnpm-lock.yaml; then corepack enable && pnpm install --frozen-lockfile; else npm ci; fi'
      - name: Run mutation gate (scoped to PR changes)
        run: |
          echo "refs/heads/head ${{ github.event.pull_request.head.sha }} refs/heads/base ${{ github.event.pull_request.base.sha }}" | npx tsx scripts/mutation-gate.ts

  # Fallow health report against real Istanbul coverage — a quality signal, not
  # a gate. Non-blocking (continue-on-error) so a health regression never fails
  # the build.
  fallow-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: sh -c 'if test -f pnpm-lock.yaml; then corepack enable && pnpm install --frozen-lockfile; else npm ci; fi'
      - name: Produce coverage + run fallow health
        run: npm run fallow:coverage
        continue-on-error: true
