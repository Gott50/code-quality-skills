name: ci

# Runs the fast gates on every PR and on push to main, the mutation gate on PRs
# only (it is the slowest), and the fallow health report as a non-blocking
# signal. Markdown-only changes skip the run.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The coverage gate's changed-lines mode diffs against the PR's base
          # SHA, which a depth-1 clone does not contain.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      # `bun run test` carries the per-file coverage gate, floored by the
      # committed baseline (100% when there is none).
      - name: Test with the coverage gate
        run: bun run test
        env:
          # The coverage gate's changed-lines mode: on a PR, the lines the
          # change adds or modifies must be executed, while the per-file floor
          # still governs the whole file. Empty on a push, where there is no
          # base to diff against and the per-file floor is the whole rule.
          CODE_QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha }}

  # Mutation gate — enforces the per-file mutation floors from the committed
  # baseline (0 Timeout / 0 Survived / 0 NoCoverage when there is none) on
  # the PR's changed source files. Mirrors the pre-push hook so the strongest
  # quality gate is enforced on PRs, not just local pushes.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun ci
      # The gate script is the stryker-mutation recipe's, and this workflow does
      # not require that recipe: a repo with no test file has no mutation gate
      # to run. `hashFiles` is step-level because a job-level one runs before
      # the checkout and would see no files.
      - name: Run mutation gate (scoped to PR changes)
        if: hashFiles('scripts/mutation-gate.ts') != ''
        run: |
          echo "refs/heads/head ${{ github.event.pull_request.head.sha }} refs/heads/base ${{ github.event.pull_request.base.sha }}" | bun scripts/mutation-gate.ts

  # Fallow health report against real Istanbul coverage — a quality signal, not
  # a gate. `fail-on-issues: false` keeps a health regression from failing the
  # build; `fail-on-empty-analysis: true` still fails a run that analyzed no
  # source file, because every count is zero there for the wrong reason.
  fallow-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun ci
      - name: Produce coverage
        run: bun run test && bun scripts/lcov-to-istanbul.ts --lcov coverage/lcov.info --out coverage/coverage-final.json
        continue-on-error: true
      - name: Fallow health report
        uses: fallow-rs/fallow@v3
        with:
          command: health
          coverage: coverage/coverage-final.json
          score: true
          fail-on-issues: false
          fail-on-empty-analysis: true
