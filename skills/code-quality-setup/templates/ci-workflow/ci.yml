name: ci

# Runs the fast gates on every PR and on push to main, the mutation gate on PRs
# only (it is the slowest), and the fallow health report as a non-blocking
# signal. Markdown-only changes skip the run.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      # `bun run test` carries the 100% per-file coverage gate.
      - name: Test with the coverage gate
        run: bun run test

  # Mutation gate — enforces 0 Timeout / 0 Survived / 0 NoCoverage mutants on
  # the PR's changed source files. Mirrors the pre-push hook so the strongest
  # quality gate is enforced on PRs, not just local pushes.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun ci
      - name: Run mutation gate (scoped to PR changes)
        run: |
          echo "refs/heads/head ${{ github.event.pull_request.head.sha }} refs/heads/base ${{ github.event.pull_request.base.sha }}" | bun scripts/mutation-gate.ts

  # Fallow health report against real Istanbul coverage — a quality signal, not
  # a gate. Non-blocking (continue-on-error) so a health regression never fails
  # the build.
  fallow-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun ci
      - name: Produce coverage + run fallow health
        run: bun run fallow:coverage
        continue-on-error: true
